# nginx does NOT inherit add_header into a location that defines its own add_header, so this
# snippet is included at server level AND inside every location that adds headers.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# $hsts is "" over plain HTTP (header omitted) and set over HTTPS (see the map in each conf).
add_header Strict-Transport-Security $hsts always;
