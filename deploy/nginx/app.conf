# Shared by the HTTP and HTTPS servers (included inside each `server` block).

root /usr/share/nginx/html;
index index.html;
client_max_body_size 10m;   # XMI uploads (5 MB) and assistant images (base64 inside JSON)

include /etc/nginx/case2code/security-headers.conf;

gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# Backend: REST and WebSocket share /api/. Docker's DNS is re-resolved so a backend that was
# recreated with a new IP keeps working without restarting nginx.
location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    proxy_pass $backend;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # SET (not append) the client IP: the backend trusts this header for per-client rate limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 86400s;   # idle realtime sockets
    proxy_send_timeout 86400s;
}

# Hashed build assets never change: cache for a year.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/case2code/security-headers.conf;
    try_files $uri =404;
}

# SPA fallback; the HTML itself must always be revalidated so a new deploy is picked up.
location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store";
    include /etc/nginx/case2code/security-headers.conf;
}

# Dotfiles (.env, .git, ...) are never served.
location ~ /\. {
    deny all;
    return 404;
}
