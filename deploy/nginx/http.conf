# HTTP-only mode (default): the VM is reached on port 80, no domain required.

map $scheme $hsts {
    https   "max-age=31536000";
    default "";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The WebSocket carries the JWT in the query string (?token=...): log the URI WITHOUT it.
log_format case2code '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    # In the server block so it REPLACES the default `access_log ... main` of nginx.conf
    # (which would log the full URI, token included).
    access_log /var/log/nginx/access.log case2code;
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    include /etc/nginx/case2code/app.conf;
}
